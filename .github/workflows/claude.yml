name: claude
# Карточка 019: комментарий «@claude ...» в PR или issue от владельца — Claude Code по подписке
# (секрет CLAUDE_CODE_OAUTH_TOKEN) отвечает и при необходимости правит код в ветке PR.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read
jobs:
  claude:
    if: >-
      github.actor == github.repository_owner && (
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
        run: |
          python3 -I tools/notify/tg.py "🧠 @claude вызван — $URL" || true
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model sonnet --max-turns 60
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
            --append-system-prompt "Проект Stalker Zone (Forge 1.20.1). Правила — .clinerules, карточки — docs/tasks. Проверка: bash tools/conveyor/check.sh. Не меняй .github/workflows, build.gradle, gradle.properties. Отвечай по-русски, кратко."
