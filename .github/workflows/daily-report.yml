name: daily-report
# Ежедневная сводка в Telegram (карточка 017): 20:47 МСК и вручную (Run workflow).
on:
  schedule:
    - cron: '47 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Сводка
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROXYAPI_KEY: ${{ secrets.PROXYAPI_KEY }}
        run: python3 -I tools/notify/daily_report.py
