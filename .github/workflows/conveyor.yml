name: conveyor
# Конвейер v2 (П-13, docs/claude/06-conveyor-v2.md): одна линия, карточка = падающий тест + узкое задание.
# Исполнитель — Cline + дешёвая модель OpenRouter, одна попытка (≤ 15 мин, ≤ $0,30). Старшего Claude и автослияния нет:
# PR конвейера сливает человек; после слияния конвейер берёт следующую карточку с паспортом «Конвейер: да».
# Секрет: OPENROUTER_API_KEY. Переменные (необязательно): AGENT_MODEL, CARD_MINUTES, CARD_BUDGET, MIN_BALANCE,
# CONVEYOR_PAUSED=1 — выключатель.
on:
  workflow_dispatch:
    inputs:
      card:
        description: "Номер карточки (пусто — следующая с паспортом «Конвейер: да»)"
        required: false
  pull_request:
    types: [closed]
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: conveyor
  cancel-in-progress: false
jobs:
  # Статус «готово (конвейер)» в docs/tasks/README.md ставит конвейер в main после слияния PR карточки,
  # а не исполнитель в своей ветке: иначе соседние строки таблицы конфликтуют (PR #109, #115).
  # Работает и при CONVEYOR_PAUSED=1 — слитая карточка должна стать готовой в любом случае.
  mark:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'task/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Статус карточки
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          N=$(echo "$HEAD_REF" | sed -n 's#^task/\([0-9]\{3\}\).*#\1#p')
          [ -n "$N" ] || { echo "в ветке $HEAD_REF нет номера карточки"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git pull -q --rebase origin main
            python3 -I tools/conveyor/mark_done.py "$N" || exit 0
            git diff --quiet && exit 0
            git commit -qam "$N: готово (конвейер) — статус после слияния" && git push -q origin HEAD:main && exit 0
            git reset -q --hard origin/main
          done
          exit 1
  run:
    needs: mark
    if: >-
      ${{ !cancelled() && needs.mark.result != 'failure' && vars.CONVEYOR_PAUSED != '1' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'task/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g cline
      - name: Карточка
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          CARD: ${{ github.event.inputs.card }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          CARD_MINUTES: ${{ vars.CARD_MINUTES }}
          CARD_BUDGET: ${{ vars.CARD_BUDGET }}
          MIN_BALANCE: ${{ vars.MIN_BALANCE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash tools/conveyor/conveyor.sh
