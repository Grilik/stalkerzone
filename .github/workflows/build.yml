name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Sim tests (pure Java)
        run: |
          mkdir -p out
          javac --release 17 -encoding UTF-8 -d out \
            $(find src/main/java/ru/stalkerzone/sim src/main/java/ru/stalkerzone/zonemap -name '*.java') \
            src/main/java/ru/stalkerzone/world/ZoneBounds.java src/main/java/ru/stalkerzone/artifact/ArtifactDef.java src/test/java/*.java
          for f in src/test/java/*Test.java; do
            t=$(basename "$f" .java)
            echo "::group::$t"
            java -Dfile.encoding=UTF-8 -cp out "$t"
            echo "::endgroup::"
          done
      - name: Build mod
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stalkerzone-mod
          path: build/libs/*.jar
      - name: Telegram
        if: always() && !(startsWith(github.ref_name, 'task/') && endsWith(github.ref_name, '-auto') && job.status == 'success')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ job.status }}" = success ]; then st="✅"; else st="❌"; fi
          first=$(printf '%s' "${MSG:-ручной запуск}" | head -1)
          python3 -I tools/notify/tg.py "$st сборка ${{ github.ref_name }}: $first ($AUTHOR)
          $RUN_URL" || true
