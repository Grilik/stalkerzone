name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 30
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Sim tests (pure Java)
        run: |
          mkdir -p out
          javac --release 17 -encoding UTF-8 -d out \
            $(find src/main/java/ru/stalkerzone/sim src/main/java/ru/stalkerzone/zonemap -name '*.java') \
            src/main/java/ru/stalkerzone/world/ZoneBounds.java src/main/java/ru/stalkerzone/artifact/ArtifactDef.java src/test/java/*.java
          for f in src/test/java/*Test.java; do
            t=$(basename "$f" .java)
            echo "::group::$t"
            java -Dfile.encoding=UTF-8 -cp out "$t"
            echo "::endgroup::"
          done
      - name: Build mod
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stalkerzone-mod
          path: build/libs/*.jar
      - name: Сборка для игры (релиз nightly)
        id: rel
        # карточка 018: после каждого зелёного main — jar в Releases, ссылка уходит в Telegram
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -vE -- '-(sources|slim|dev)\.jar$' | head -1)
          { echo "Сборка из main, коммит ${GITHUB_SHA::7}. Установка: заменить jar в папке mods."; echo;
            echo "Изменения:"; if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then git log --pretty='- %s' "$BEFORE..HEAD" | head -20; else git log -5 --pretty='- %s'; fi; } > /tmp/notes.md
          gh release delete nightly --cleanup-tag -y 2>/dev/null || true
          gh release create nightly "$JAR" --prerelease --target "$GITHUB_SHA" \
            --title "Сборка $(TZ=Europe/Moscow date +'%d.%m %H:%M') (${GITHUB_SHA::7})" --notes-file /tmp/notes.md
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/nightly/$(basename "$JAR")" >> "$GITHUB_OUTPUT"
      - name: Telegram
        if: always() && !(startsWith(github.ref_name, 'task/') && endsWith(github.ref_name, '-auto') && job.status == 'success')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JAR_URL: ${{ steps.rel.outputs.url }}
        run: |
          if [ "${{ job.status }}" = success ]; then st="✅"; else st="❌"; fi
          first=$(printf '%s' "${MSG:-ручной запуск}" | head -1)
          if [ -n "$JAR_URL" ]; then extra="🎮 скачать для игры: $JAR_URL"; else extra="$RUN_URL"; fi
          python3 -I tools/notify/tg.py "$st сборка ${{ github.ref_name }}: $first ($AUTHOR)
          $extra" || true
