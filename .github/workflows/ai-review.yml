name: ai-review
# Автоматический ревьюер PR другой моделью через OpenRouter.
# Нужен секрет репозитория OPENROUTER_API_KEY. Модель можно сменить переменной репозитория REVIEW_MODEL.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ревью
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I tools/review/ai_review.py > review.md
      - name: Комментарий в PR
        # правим только свой комментарий ревью (по заголовку): --edit-last затирал ответы @claude того же бота
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments?per_page=100" --jq '[.[] | select(.body | startswith("## 🤖 Автоматическое ревью"))] | last | .id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@review.md >/dev/null
          else
            gh pr comment "$N" --body-file review.md
          fi
