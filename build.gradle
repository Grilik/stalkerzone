plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // нужно для модов с миксинами (TaCZ) в среде разработки
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            // для проверки: ./gradlew runClient -PquickWorld=<папка мира в run/saves> сразу открывает мир
            if (project.hasProperty('quickWorld')) {
                args '--quickPlaySingleplayer', project.property('quickWorld')
            }
        }
        server {
            args '--nogui'
        }
    }
}

repositories {
    // TaCZ нужен только для запуска в среде разработки; в мод он не входит (связь через отражение).
    // Файл libs/tacz-1.20.1.jar скачивает скрипт сборки (get_tacz.ps1) с Modrinth.
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    if (!project.hasProperty('noTacz') && file('libs/tacz-1.20.1.jar').exists()) {
        runtimeOnly fg.deobf("local:tacz:1.20.1")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    finalizedBy 'reobfJar'
}
